plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.hilt)
    alias(libs.plugins.detekt.plugin)
    alias(libs.plugins.ktlint.plugin)
    alias(libs.plugins.spotless.plugin)
}

// Read the API-Football key from local.properties (not versioned).
// Never hardcode the key value in versioned files.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def apiFootballKey = localProperties.getProperty("API_FOOTBALL_KEY", "")
def newsDataKey = localProperties.getProperty("NEWSDATA_API_KEY", "")

android {
    namespace 'com.diyebure.golia'
    compileSdk 36

    defaultConfig {
        applicationId "com.diyebure.golia"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // API-Football key exposed via BuildConfig, read from local.properties.
        buildConfigField "String", "API_FOOTBALL_KEY", "\"${apiFootballKey}\""

        // NewsData.io key exposed via BuildConfig, read from local.properties.
        buildConfigField "String", "NEWSDATA_API_KEY", "\"${newsDataKey}\""

        // Export Room schemas (JSON) so migration tests can validate the
        // migrated schema with MigrationTestHelper. Schemas are written to
        // app/schemas/<db-class>/<version>.json (e.g. version 2 and 3).
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    // Make the exported Room schemas available to instrumented (androidTest)
    // tests so MigrationTestHelper can locate them at runtime.
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // Permite que los tests unitarios JVM ejerciten código que toca stubs de
    // Android (p. ej. android.text.TextUtils dentro de MatchUiMapper) sin
    // necesidad de Robolectric: los métodos no implementados devuelven valores
    // por defecto en lugar de lanzar "Method ... not mocked".
    testOptions {
        unitTests.returnDefaultValues = true
        // Run JVM unit tests on the JUnit Platform so jqwik (JUnit 5) property
        // tests are discovered. junit-vintage-engine (added below) keeps any
        // existing JUnit4 unit tests runnable on the same platform.
        unitTests.all {
            useJUnitPlatform()
        }
    }
    
    lint {
        abortOnError = false
        baseline = file("config/lint-baseline.xml")
        checkDependencies = true
        warningsAsErrors = false
        lintConfig = file("config/lint.xml")
        
        disable = [
            'ObsoleteLintCustomCheck',
            'IconLocation',
            'TypographyQuotes',
            'UnusedResources'
        ]
        
        enable = [
            'MissingTranslation',
            'NewerVersionAvailable',
            'UnsafeProtectedConfiguration',
            'UnsafeThreadAnnotation'
        ]
        
        // Strict mode checks
        checkReleaseBuilds = true
        fatal 'StopShip'
        warning 'ImpliedQuantity'
        informational 'MissingTranslation'
    }
}

dependencies {
    // Core Android
    implementation libs.activity.ktx
    implementation libs.annotation
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.fragment

    // Lifecycle
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx

    // Material Design
    implementation libs.material
    implementation libs.vectordrawable.animated

    // SwipeRefreshLayout (pull-to-refresh en la Pantalla_Partidos)
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // ExifInterface (corrección de orientación EXIF de la foto de perfil - R8.6).
    // FileProvider (androidx.core.content.FileProvider) para la captura de cámara
    // llega de forma transitiva vía appcompat/activity-ktx/fragment/material.
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // Lottie for animations
    implementation 'com.airbnb.android:lottie:3.0.1'

    // Room
    implementation libs.room.runtime
    implementation libs.room.ktx
    annotationProcessor libs.room.compiler

    // Retrofit & OkHttp
    implementation libs.retrofit
    implementation libs.retrofit.gson
    implementation libs.okhttp
    implementation libs.okhttp.logging

    // Gson
    implementation libs.gson

    // Navigation
    implementation libs.navigation.fragment
    implementation libs.navigation.ui

    // Coroutines
    implementation libs.coroutines.core
    implementation libs.coroutines.android

    // Glide
    implementation libs.glide
    annotationProcessor libs.glide.compiler

    // Hilt
    implementation 'com.google.dagger:hilt-android:2.60.1'
    annotationProcessor 'com.google.dagger:hilt-compiler:2.60.1'

    // Testing
    testImplementation libs.junit
    // jqwik: property-based testing on the JUnit Platform (JUnit 5) for the pure
    // domain calculator. Pinned via the version catalog.
    testImplementation libs.jqwik
    // Fluent assertions for both property and example tests.
    testImplementation 'org.assertj:assertj-core:3.25.3'
    // JUnit Platform launcher so the JUnit 5 engine (jqwik) is discovered by Gradle.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    // Vintage engine lets any JUnit4 unit tests run on the same JUnit Platform
    // alongside jqwik's JUnit5 engine.
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.10.2'
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit

    // Room migration testing (MigrationTestHelper), pinned to the Room version.
    androidTestImplementation libs.room.testing
}


// Apply code quality configuration
apply from: '../code-quality.gradle'