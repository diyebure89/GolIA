# ======================================================================
# Configuracion del backend GolIA
#
# Las credenciales NUNCA se hardcodean aqui: se leen de variables de
# entorno. En local puedes exportarlas o crear un application-local.properties
# (ignorado por git). En produccion (Render/Railway) se definen en el panel.
#
# Valores por defecto ${VAR:default} => pensados para un MySQL local de
# desarrollo. Para Aiven, sustituye por la connection string que te da el panel.
# ======================================================================

server.port=${PORT:8080}

# --- Conexion a la base de datos ---
# Default: MySQL/MariaDB local (XAMPP: root sin contrasena, puerto 3306).
# Ejemplo Aiven: jdbc:mysql://<host>:<puerto>/<db>?ssl-mode=REQUIRED
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/golia?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# 'update' crea/actualiza el esquema automaticamente desde las entidades.
# Para produccion seria se recomienda una herramienta de migracion (Flyway),
# pero para el enfoque minimo 'update' es suficiente y comodo.
spring.jpa.hibernate.ddl-auto=${JPA_DDL:update}
spring.jpa.show-sql=false
# Sin dialecto forzado: Hibernate lo detecta automaticamente, asi funciona
# igual con MySQL real y con MariaDB (el motor que trae XAMPP).
spring.jpa.open-in-view=false

# --- JWT ---
# Clave secreta para firmar los tokens (HS256). DEBE tener al menos 32 bytes.
# En produccion define GOLIA_JWT_SECRET con un valor largo y aleatorio.
golia.jwt.secret=${GOLIA_JWT_SECRET:cambia-esta-clave-por-una-larga-y-aleatoria-de-al-menos-32-bytes}
# Duracion del access token en segundos (por defecto 1 hora).
golia.jwt.access-expiration-seconds=${GOLIA_JWT_ACCESS_EXP:3600}
# Duracion del refresh token en segundos (por defecto 30 dias).
golia.jwt.refresh-expiration-seconds=${GOLIA_JWT_REFRESH_EXP:2592000}
