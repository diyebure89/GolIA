# Detekt configuration for GolIA Android project
# Based on Detekt 1.23.4 with Android-specific rules

build:
  maxIssues: 10
  weights:
    complexity: 2
    LongParameterList: 1
    style: 1
    comments: 1

comments:
  active: true
  CommentOverPrivateFunction:
    active: true
  CommentOverPrivateProperty:
    active: true
  EndOfSentenceFormat:
    active: true
    endOfSentenceFormat: ([.?!…][ \t\n\r\f<])|([.?!…]$)
  UndocumentedPublicClass:
    active: true
    searchInNestedClass: true
    searchInInnerClass: true
    searchInInnerObject: true
    searchInInnerInterface: true
  UndocumentedPublicFunction:
    active: true

complexity:
  active: true
  ComplexCondition:
    active: true
    threshold: 4
  ComplexInterface:
    active: true
    threshold: 10
    includeStaticDeclarations: false
  ComplexMethod:
    active: true
    threshold: 10
    ignoreSingleWhenExpression: false
    ignoreSimpleWhenEntries: true
  LabeledExpression:
    active: true
  LargeClass:
    active: true
    threshold: 600
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    threshold: 6
    ignoreDefaultParameters: true
  NestedBlockDepth:
    active: true
    threshold: 4
  TooManyFunctions:
    active: true
    thresholdInClasses: 11
    thresholdInInterfaces: 11
    thresholdInObjects: 11
    thresholdInEnums: 11
    ignoreDeprecated: false
    ignorePrivate: false
    ignoreOverridden: false

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
    ignoreFunctionsWithAnnotation: ["io.mockk.impl.annotations.InjectMockKs"]
  RedundantSuspendModifier:
    active: true

empty-blocks:
  active: true
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: "^(_|(ignore|expected).*)"
  EmptyClassBlock:
    active: true
  EmptyDefaultConstructor:
    active: true
  EmptyDoWhileBlock:
    active: true
  EmptyElseBlock:
    active: true
  EmptyFinallyBlock:
    active: true
  EmptyForBlock:
    active: true
  EmptyFunctionBlock:
    active: true
  EmptyIfBlock:
    active: true
  EmptyInitBlock:
    active: true
  EmptyKtFile:
    active: false
  EmptySecondaryConstructor:
    active: true
  EmptyWhenBlock:
    active: true
  EmptyWhileBlock:
    active: true

exceptions:
  active: true
  ExceptionRaisedInUnexpectedLocation:
    active: true
    methodNames: "toString,hashCode,equals,finalize"
  IgnoredException:
    active: true
  PrintStackTrace:
    active: true
  RethrowCaughtException:
    active: true
  ReturnFromFinally:
    active: true
  SwallowException:
    active: true
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - ArrayIndexOutOfBoundsException
      - Error
      - Exception
      - IllegalMonitorStateException
      - NullPointerException
      - IndexOutOfBoundsException
      - RuntimeException
      - Throwable

formatting:
  active: true
  AnnotationOnSeparateLine:
    active: true
  AnnotationSpacing:
    active: true
  ArgumentListWrapping:
    active: true
    indentSize: 4
  BlockCommentInitialStarAlignment:
    active: true
  ChainMethodContinuationIndentation:
    active: true
  ClassSignature:
    active: true
  CommentSpacing:
    active: true
  EnumWrapping:
    active: true
    indentSize: 4
  Filename:
    active: true
    pattern: '^([A-Z][a-z0-9]*)+\.(kt|kts)$'
    excludeClassPattern: '$^'
    excludeAnnotatedClassPattern: '$^'
  FinalNewline:
    active: true
  ImportOrdering:
    active: true
    layout: *,^
    importPatterns: 
      - "import com.android.*"
      - "import androidx.*"
      - "import dagger.*"
      - "import kotlin.*"
      - "import java.*"
      - "import javax.*"
      - "import com.google.*"
      - "import io.*"
      - "import **"
  Indentation:
    active: true
    indentSize: 4
    continuationIndentSize: 4
  KdocWrapping:
    active: true
  MaximumLineLength:
    active: true
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: true
  ModifierOrdering:
    active: true
    modifierOrder: "public,protected,private,internal,expect,actual,final,open,abstract,sealed,const,external,override,lateinit,tailrec,vararg,suspend,inner,enum,annotation,companion,inline,infix,operator,data,value"
  MultiLineIfElse:
    active: true
    ifElseBraceOnSameLine: false
  MultilineExpressionWrapping:
    active: true
  NewLineAtEndOfFile:
    active: true
  NoBlankLineBeforeRbrace:
    active: true
  NoConsecutiveBlankLines:
    active: true
  NoEmptyFirstLineInMethodBlock:
    active: true
  NoLineBreakAfterElse:
    active: true
  NoLineBreakBeforeAssignment:
    active: true
  NoTrailingSpaces:
    active: true
  NullableTypeSpacing:
    active: true
  ParameterListSpacing:
    active: true
  ParameterListWrapping:
    active: true
    indentSize: 4
  SpacingAroundAngleBrackets:
    active: true
  SpacingAroundColon:
    active: true
  SpacingAroundComma:
    active: true
  SpacingAroundCurly:
    active: true
  SpacingAroundDot:
    active: true
  SpacingAroundKeyword:
    active: true
  SpacingAroundOperator:
    active: true
  SpacingAroundParens:
    active: true
  SpacingAroundRangeOperator:
    active: true
  SpacingAroundUnaryOperator:
    active: true
  StringTemplate:
    active: true
  TrailCommentSpacing:
    active: true

performance:
  active: true
  ForEachOnRange:
    active: true
  SpreadOperator:
    active: true
  UnnecessaryTemporaryInstantiation:
    active: true

potential-bugs:
  active: true
  DuplicateCaseInWhenExpression:
    active: true
  EqualsWithHashCodeExist:
    active: true
  ExplicitGarbageCollectionCall:
    active: true
  UnreachableCode:
    active: true
  UnusedPrivateMember:
    active: true
    searchInNestedClasses: true
  UnnecessaryVar:
    active: true

style:
  active: true
  BooleanPropertyNaming:
    active: true
  ClassNaming:
    active: true
    classPattern: '[A-Z][a-zA-Z0-9]*'
  ConstructorParameterNaming:
    active: true
    parameterPattern: '[a-z][A-Za-z0-9]*'
    excludeClassPattern: '$^'
    privateConstructorParameterPattern: '(_)?[a-z][A-Za-z0-9]*'
  EnumNaming:
    active: true
    enumEntryPattern: '^[A-Z][_a-zA-Z0-9]*'
  ForbiddenClassName:
    active: true
    forbiddenName: []
  ForbiddenComment:
    active: true
    values: "TODO:,FIXME:,STOPSHIP:"
  ForbiddenImport:
    active: true
    imports: 
      - "java.util.Date"
      - "java.sql.Date"
      - "java.util.Calendar"
  FunctionMaxLength:
    active: true
    maximumFunctionNameLength: 60
  FunctionNaming:
    active: true
    functionPattern: '^[a-z][a-zA-Z0-9]*$'
    excludeFunctionPattern: '^`.*`$'
    ignoreOverridden: true
  FunctionParameterNaming:
    active: true
    parameterPattern: '[a-z][A-Za-z0-9]*'
    excludeParameterPattern: '$^'
    ignoreOverriddenFunctions: true
    ignoreAnnotated: ["com.google.gson.annotations.SerializedName"]
  MatchingDeclarationName:
    active: true
  MemberNameEqualsClassName:
    active: true
  ObjectPropertyNaming:
    active: true
    propertyPattern: '^[a-z][A-Za-z0-9]*$'
    constantPattern: '^[A-Z][_A-Z0-9]*$'
    objectPattern: '^[A-Z][a-zA-Z0-9]*$'
  PackageNaming:
    active: true
    packagePattern: '^[a-z]+(\.[a-z][a-z0-9]*)*$'
  SafeCast:
    active: true
  SerialVersionUIDInSerializableClass:
    active: true
  TopLevelPropertyNaming:
    active: true
    constantPattern: '^[A-Z][_A-Z0-9]*$'
    propertyPattern: '^[a-z][A-Za-z0-9]*$'
    privatePropertyPattern: '^(_)?[a-z][A-Za-z0-9]*$'
  UnnecessaryAbstractClass:
    active: true
    excludedAnnotations: ["dagger.hilt.android.AndroidEntryPoint", "javax.inject.Singleton"]
  UnnecessaryParentheses:
    active: true
  UseDataClass:
    active: true
    excludeAnnotatedClasses: ["Entity", "Parcelize", "AndroidEntryPoint"]
  UtilityClassWithPublicConstructor:
    active: true
  VariableNaming:
    active: true
    variablePattern: '^(_)?[a-z][a-zA-Z0-9]*$'
    excludeVariablePattern: '$^'
    privateVariablePattern: '^(_)?[a-z][a-zA-Z0-9]*$'
    constantPattern: '^[A-Z_][A-Z0-9_]*$'
    allowUnderscoresInConstantPattern: true
    excludeClassPattern: '$^'

# Android specific rules
android:
  active: true
  AllowedAndroidHardwareId:
    active: true
    allowedHardwareIds: []
  DirectBootAware:
    active: true
  GradleOverrides:
    active: true
  InlineOnViewModifierMissing:
    active: true
  JobInCoroutineScope:
    active: true
  MandatoryLifecycleObserverModifier:
    active: true
  MandatoryViewModifier:
    active: true
  MismatchingActivityIntentKey:
    active: true
  MultipleBoundServices:
    active: true
  NoDataClassInViewModel:
    active: true
  NoHardCodedText:
    active: true
  NoIntentFilterWithoutAction:
    active: true
  NoSyntheticViewBinding:
    active: true
  NoVoidIntent:
    active: true
  OverrideForbiddenCalls:
    active: true
  PrintStackTrace:
    active: true
  SerializableSerialVersionUID:
    active: true
  ServiceInForeground:
    active: true
  UseCheckPermission:
    active: true
  UseDataBinding:
    active: true
  UseRequireInsteadOfAssert:
    active: true
  UseRequireNotNull:
    active: true
  UseViewModelProvider:
    active: true
  ViewModelCreationInjection:
    active: true

# Custom rules configuration
rule-sets:
  - rule-set-exclude: "comments/UndocumentedPublicClass"
    active: false
  - rule-set-exclude: "comments/UndocumentedPublicFunction"
    active: false